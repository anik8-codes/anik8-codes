name: Generate anik8 snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: anik8-codes
          outputs: |
            dist/anik8-snake.svg?color_snake=#d62828&color_dots=#f1eef7,#d9d1ea,#b3a5d1,#8b7bb0,#5e4f86

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
